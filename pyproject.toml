[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "png_tools"
version = "0.1.0"
description = "PNG processing tools for Pac-Man project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow",
    "textual"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
